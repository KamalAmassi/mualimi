<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تغيير الصف — الوضع الداكن</title>
</head>
<body style="margin:0; background:#8A86A0; display:flex; justify-content:center; padding:24px">


<link rel="preconnect" href="Dark_https://fonts.googleapis.com"><link rel="preconnect" href="Dark_https://fonts.gstatic.com" crossorigin="anonymous"><link href="Dark_https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B6A7FF}a:hover{color:#DCD6FF}
</style>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #F5F3FF; background: #17152A; display: flex; flex-direction: column">
<div style="background: #24213B; padding: 24px 20px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #36314F"><span style="width: 64px; height: 64px; border-radius: 22px; background: #9B87F5; color: #17152A; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center">أ</span><div><div style="font-size: 22px; font-weight: 700">أحمد</div><div style="font-size: 13px; color: #B9B2D0">الصف التاسع</div></div></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px"><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: #000000A6"></div>
<div role="dialog" aria-label="تغيير الصف" style="position: absolute; right: 0; left: 0; bottom: 0; background: #24213B; border-radius: 28px 28px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 30px #00000033">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4D4670"></div>
<div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 19px; font-weight: 700; flex: 1">تغيير الصف</h2><button type="button" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #2E2A4A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5F3FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button></div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><button type="button" disabled="disabled" style="height: 60px; border-radius: 14px; border: 1px solid #36314F; background: #24213B; font-family: inherit; font-size: 14px; color: #D6D0E8">السابع<span style="display: block; font-size: 10.5px; color: #B2D5F8">قريباً</span></button><button type="button" disabled="disabled" style="height: 60px; border-radius: 14px; border: 1px solid #36314F; background: #24213B; font-family: inherit; font-size: 14px; color: #D6D0E8">الثامن<span style="display: block; font-size: 10.5px; color: #B2D5F8">قريباً</span></button><button type="button" aria-pressed="true" style="height: 60px; border-radius: 14px; border: 2px solid #9B87F5; background: #2F2856; font-family: inherit; font-size: 14px; font-weight: 700; color: #D6CEFF">التاسع<span style="display: block; font-size: 10.5px; font-weight: 500">صفك الحالي</span></button><button type="button" disabled="disabled" style="height: 60px; border-radius: 14px; border: 1px solid #36314F; background: #24213B; font-family: inherit; font-size: 14px; color: #D6D0E8">العاشر<span style="display: block; font-size: 10.5px; color: #B2D5F8">قريباً</span></button><button type="button" disabled="disabled" style="height: 60px; border-radius: 14px; border: 1px solid #36314F; background: #24213B; font-family: inherit; font-size: 14px; color: #D6D0E8">الحادي عشر<span style="display: block; font-size: 10.5px; color: #B2D5F8">قريباً</span></button><button type="button" disabled="disabled" style="height: 60px; border-radius: 14px; border: 1px solid #36314F; background: #24213B; font-family: inherit; font-size: 14px; color: #D6D0E8">الثاني عشر<span style="display: block; font-size: 10.5px; color: #B2D5F8">قريباً</span></button></div>
<div role="status" style="background: #1A2E45; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#74B4F2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 11v5 M12 8h.01"></path></svg><div><div style="font-size: 14px; font-weight: 700; color: #B2D5F8">عند تغيير الصف</div><div style="font-size: 13px; line-height: 1.65; color: #B2D5F8; margin-top: 2px">تُنزَّل رزمة الصف الجديد، ويبقى المعلّم الذكي ومحفوظاتك وسجل أسئلتك كما هي.</div></div></div>
<button type="button" disabled="disabled" style="height: 52px; border-radius: 14px; border: 0; background: #2E2A4A; color: #B9B2D0; font-family: inherit; font-size: 15px; font-weight: 700">اختر صفاً للمتابعة</button></div>
</div>

</body>
</html>
