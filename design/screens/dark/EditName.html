<!doctype html>

<head>

<title>تعديل الاسم — الوضع الداكن</title>
</head>
<body style="margin:0; background:#8A86A0; display:flex; justify-content:center; padding:24px">


<link rel="preconnect" href="Dark_https://fonts.googleapis.com"><link rel="preconnect" href="Dark_https://fonts.gstatic.com" crossorigin="anonymous"><link href="Dark_https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B6A7FF}a:hover{color:#DCD6FF}
</style>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #F5F3FF; background: #17152A; display: flex; flex-direction: column">
<div style="background: #24213B; padding: 24px 20px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #36314F"><span style="width: 64px; height: 64px; border-radius: 22px; background: #9B87F5; color: #17152A; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center">أ</span><div><div style="font-size: 22px; font-weight: 700">أحمد</div><div style="font-size: 13px; color: #B9B2D0">الصف التاسع</div></div></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px"><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div><div style="height: 64px; border-radius: 18px; background: #24213B; border: 1px solid #36314F"></div></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: #000000A6"></div>
<div role="dialog" aria-label="تعديل الاسم" style="position: absolute; right: 0; left: 0; bottom: 0; background: #24213B; border-radius: 28px 28px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 30px #00000033">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4D4670"></div>
<div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 19px; font-weight: 700; flex: 1">تعديل الاسم</h2><button type="button" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #2E2A4A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5F3FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button></div>

<div style="display: flex; flex-direction: column; gap: 8px"><label for="en" style="font-size: 14px; font-weight: 600">اسمك</label>
<input id="en" type="text" value="أحمد" style="height: 54px; border-radius: 16px; border: 2px solid #9B87F5; background: #24213B; padding: 0 16px; font-family: inherit; font-size: 16px; color: #F5F3FF; outline: none; box-sizing: border-box; width: 100%">
<div style="font-size: 12px; color: #B9B2D0">يظهر في التحية فقط، ويبقى على جهازك.</div></div>
<button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #9B87F5; color: #17152A; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%">حفظ</button></div>
</div>
